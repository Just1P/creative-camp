<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene de crime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="decor">
        <video
          class="decor-video"
          src="../assets/videos/scene-de-crime.mp4"
          poster="../assets/images/scene-de-crime.png"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          aria-hidden="true"
        ></video>
      </div>
      <div class="zoom" role="dialog" aria-label="Vue rapprochée">
        <button class="zoom-objet" type="button">
          <img class="zoom-image" alt="" draggable="false" />
        </button>
      </div>
      <section class="objectifs" aria-label="Objectifs">
        <h2 class="objectifs-titre">Objectifs</h2>
        <ul class="objectifs-liste"></ul>
      </section>

      <div class="inventaire vide">
        <button class="inventaire-bouton" type="button" aria-label="Ouvrir l'inventaire">
          <svg viewBox="0 0 7 4" aria-hidden="true">
            <path d="M3 0h1v1h1v1h1v1h1v1H5V3H4V2H3v1H2v1H0V3h1V2h1V1h1z" fill-rule="evenodd" />
          </svg>
        </button>
        <p class="inventaire-message" role="status"></p>
        <div class="inventaire-cases">
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
        </div>
      </div>

      <div class="digicode" role="dialog" aria-label="Digicode du coffre">
        <div class="digicode-boitier">
          <p class="digicode-ecran" aria-live="polite"></p>
          <div class="digicode-touches"></div>
          <img class="digicode-indice" alt="" draggable="false" />
        </div>
      </div>
    </div>
    <audio
      autoplay
      class="ambiance"
      src="../assets/musiques/rain-on-window.mp3"
      loop
      preload="auto"
    ></audio>
    <audio autoplay class="musique" loop preload="auto"></audio>
    <script src="../shared/base.js"></script>
    <script src="zones.js"></script>
    <script src="script.js"></script>
    <script src="digicode.js"></script>
    <script src="zoom.js"></script>
  </body>
</html>
