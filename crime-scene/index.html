<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene de crime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <img src="../assets/images/scene-de-crime.png" alt="scene de fond" draggable="false" />
      <div
        class="progression"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <canvas width="50" height="50" aria-hidden="true"></canvas>
        <span class="progression-texte">0%</span>
      </div>

      <div class="inventaire">
        <p class="inventaire-message" role="status"></p>
        <div class="inventaire-cases">
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
        </div>
      </div>
    </div>
    <script src="zones.js"></script>
    <script src="script.js"></script>
  </body>
</html>
