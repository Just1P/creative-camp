<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene de crime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <img src="public/crime-scene-bg.png" alt="scene de fond" draggable="false" />
      <button
        class="zone"
        style="left: 42%; top: 73%; width: 32%; height: 16%"
        data-titre="Corp"
        data-description="Blessures et trace de tissu du manteau d’angela "
      ></button>
      <button
        class="zone"
        style="left: 18.25%; top: 8.5%; width: 33%; height: 55%"
        data-titre="Fenêtre"
        data-description="Ça fait maintenant 34 jours qu’il pleut..."
      ></button>
      <button
        class="zone"
        style="left: 60%; top: 93%; width: 8%; height: 5%"
        data-titre="Arme"
        data-description="Arme du meurtre avec aucune empreinte de la victime"
        data-preuve="Ce pistolet semble être l’arme du crime"
      ></button>
      <button
        class="zone"
        style="left: 40%; top: 81%; width: 9.5%; height: 12%"
        data-titre="Malette"
        data-description="Une malette posée à côté du corps."
      ></button>
      <button
        class="zone"
        style="left: 94%; top: 33%; width: 6%; height: 45%"
        data-titre="Porte menteau"
        data-description="Ca sert à porter des manteaux en gros"
      ></button>
      <button
        class="zone"
        style="left: 80%; top: 52%; width: 11%; height: 35%"
        data-titre="Coffre"
        data-description="Dossiers confidentiels d’arrestations d’humains autorisés et signés par des repliquants haut placés"
      ></button>
      <button
        class="zone"
        style="left: 83%; top: 35%; width: 9%; height: 16%"
        data-titre="Emission de propagande"
        data-description="Présente Angela comme une terroriste , média manipulé par le gouvernement"
      ></button>
      <button
        class="zone"
        style="left: 74%; top: 2%; width: 11%; height: 16%"
        data-titre="Lampadaire"
        data-description="C’est vraiment juste un lampadaire."
      ></button>
      <button
        class="zone"
        style="left: 65%; top: 13%; width: 4%; height: 8%"
        data-titre="Caméra"
        data-description="Enregistrement partiel de l’effraction, mais le meurtre et la lutte ont été effacés."
      ></button>
      <button
        class="zone"
        style="left: 62%; top: 22%; width: 10%; height: 28%"
        data-titre="Trace de sang"
        data-description="Traces de sang appartenant à Angela."
      ></button>
      <button
        class="zone"
        style="left: 66%; top: 52%; width: 7%; height: 15%"
        data-titre="Photos"
        data-description="Visages d’humains disparus dont la soeur d’Angela."
      >
        <span class="zone-extension" style="left: -57%; top: 13%; width: 57%; height: 43%"></span>
      </button>
      <button
        class="zone"
        style="left: 60%; top: 61%; width: 5%; height: 5%"
        data-titre="Messagerie"
        data-description="Menaces recues en anonyme mais on peut reconnaire Angela."
      ></button>
      <button
        class="zone"
        style="left: 50%; top: 52%; width: 9%; height: 15%"
        data-titre="Aquarium"
        data-description="Quelle idée de mettre ses poissons dans une TV..."
      ></button>
      <button
        class="zone"
        style="left: 31%; top: 61%; width: 5%; height: 30%"
        data-titre="Terminal"
        data-description="Un vieux terminal, l’écran est encore allumé."
      ></button>
      <button
        class="zone"
        style="left: 22.5%; top: 70%; width: 8.5%; height: 12%"
        data-titre="Vinyle"
        data-description="Même en 2099, Wish You Were Here reste un classique."
      ></button>
      <button
        class="zone"
        style="left: 13.75%; top: 63.5%; width: 6%; height: 28%"
        data-titre="Lampe"
        data-description="Une lampe à lave qui diffuse une lueur violette."
      ></button>
      <button
        class="zone"
        style="left: 17%; top: 45.5%; width: 10.5%; height: 18%"
        data-titre="Bonsaï"
        data-description="Code du coffre-fort caché à l’intérieur."
      ></button>
      <button
        class="zone"
        style="left: 6%; top: 38.5%; width: 7.5%; height: 57%"
        data-titre="Juke-box"
        data-description="Un vieux juke-box, il ne marche plus depuis longtemps."
      ></button>
      <button
        class="zone"
        style="left: 9.75%; top: 0%; width: 12%; height: 13.5%"
        data-titre="Enseigne"
        data-description="Empathy Tester, l’enseigne est éteinte."
      ></button>
      <button
        class="zone"
        style="left: 69%; top: 66.75%; width: 13%; height: 6.25%"
        data-titre="Échiquier"
        data-description="Une partie d’échecs laissée en plan."
      ></button>

      <div
        class="progression"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <canvas width="50" height="50" aria-hidden="true"></canvas>
        <span class="progression-texte">0%</span>
      </div>

      <div class="inventaire">
        <p class="inventaire-message" role="status"></p>
        <div class="inventaire-cases">
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
          <div class="case"></div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
