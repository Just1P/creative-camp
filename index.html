<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene de crime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <img src="public/crime-scene-bg.png" alt="scene de fond" draggable="false" />
      <button
        class="zone"
        style="left: 40%; top: 73%; width: 35%; height: 20%"
        data-titre="Zone 1"
        data-description="Description de l'indice trouvé dans la zone 1."
      ></button>
      <button
        class="zone"
        style="left: 45%; top: 45%; width: 5%; height: 22%"
        data-titre="Zone 2"
        data-description="Description de l'indice trouvé dans la zone 2."
      ></button>
      <button
        class="zone"
        style="left: 82%; top: 34%; width: 11%; height: 20%"
        data-titre="Zone 3"
        data-description="Description de l'indice trouvé dans la zone 3."
      ></button>

      <div class="progression" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas width="50" height="50" aria-hidden="true"></canvas>
        <span class="progression-texte">0%</span>
      </div>

      <div class="loupe" hidden>
        <div class="loupe-image">
          <img src="public/crime-scene-bg.png" alt="" draggable="false" />
        </div>
        <div class="bulle">
          <button class="bulle-fermer" aria-label="Fermer">×</button>
          <h2 class="bulle-titre"></h2>
          <p class="bulle-description"></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
