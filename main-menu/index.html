<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blade Runner 2099</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <video class="scene__bg" src="../assets/videos/menu-fond.mp4" autoplay muted loop playsinline></video>
      <div class="titles">
        <h1 data-text="blade runner">blade runner</h1>
        <h1 class="number" data-text="2099">2099</h1>
      </div>
      <img class="character character--reflection" src="../assets/images/personnage.png" alt="" aria-hidden="true" />
      <img class="character" src="../assets/images/personnage.png" alt="" />
    </div>
    <nav class="menu">
      <button class="menu__btn" type="button" data-text="jouer" data-href="../crime-scene/index.html">jouer</button>
      <button class="menu__btn" type="button" data-text="paramètres">paramètres</button>
      <button class="menu__btn" type="button" data-text="trailer" data-open-trailer>trailer</button>
    </nav>
    <div class="trailer" aria-hidden="true">
      <div class="trailer__backdrop" data-close-trailer></div>
      <div class="trailer__panel" role="dialog" aria-modal="true" aria-label="Trailer">
        <button class="trailer__close" type="button" aria-label="Fermer" data-close-trailer>&times;</button>
        <video
          class="trailer__video"
          src="../assets/videos/trailer.mp4"
          controls
          preload="metadata"
          playsinline
        ></video>
      </div>
    </div>
    <audio class="musique" src="../assets/musiques/bladerunner2099.mp3" loop preload="auto"></audio>
    <div class="corner corner--tl"></div>
    <div class="corner corner--tr"></div>
    <div class="corner corner--bl"></div>
    <div class="corner corner--br"></div>
    <script src="../shared/base.js"></script>
    <script src="script.js"></script>
  </body>
</html>
